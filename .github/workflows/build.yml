      - name: Prepare X IPA
        if: env.BUILD_DEPLOY_FORMAT == 'sideloaded' || env.BUILD_DEPLOY_FORMAT == 'trollstore'
        run: |
          wget "$IPA_URL" --no-verbose -O main/packages/com.atebits.Tweetie2.ipa
          unzip -q main/packages/com.atebits.Tweetie2.ipa -d main/tmp
          APP_PLIST=$(find main/tmp/Payload -maxdepth 2 -name Info.plist -print -quit)
          if [ -z "$APP_PLIST" ]; then
            echo "The archive does not contain Payload/*.app/Info.plist" >&2
            exit 1
          fi
          X_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          X_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
          echo "X_VERSION=${X_VERSION}" >> "$GITHUB_ENV"
          echo "X_BUILD=${X_BUILD}" >> "$GITHUB_ENV"
          echo "$X_VERSION"
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
